<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Tourist Help</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">India Tourist Help</div>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#top-places">Top Places</a></li>
                    <li><a href="#blogs">Blogs</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="container">
            <h1>Explore India with Trusted Tourist Support</h1>
            <div class="customer-care-numbers">
                <!-- Customer care numbers will be inserted here -->
            </div>
        </div>
    </section>

    <section id="top-places" class="top-places-section">
        <div class="container">
            <h2>Top Tourist Places</h2>
            <div class="place-cards">
                <!-- Tourist place cards will be inserted here -->
            </div>
        </div>
    </section>

    <section id="blogs" class="blog-section">
        <div class="container">
            <h2>Travel Blogs</h2>
            <div class="blog-posts">
                <!-- Blog posts will be inserted here -->
            </div>
        </div>
    </section>

    <footer id="contact">
        <div class="container">
            <div class="footer-customer-care">
                <!-- Customer care numbers will be repeated here -->
            </div>
            <p class="disclaimer">Disclaimer: All information provided is for general guidance only. Please verify details with local authorities.</p>
            <p class="copyright">Copyright © India Tourist Help 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
